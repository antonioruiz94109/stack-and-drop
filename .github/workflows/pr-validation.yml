name: PR validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and checker tests
        run: |
          python -m py_compile scripts/check_catalog.py scripts/completion_watch.py scripts/release_watch.py scripts/test_check_catalog.py
          python -m unittest discover -s scripts -p 'test_check_catalog.py'
      - name: Catalog JSON parse check
        run: python -m json.tool shoes.json > /dev/null
      - name: Verify published entrypoints exist
        run: test -s index.html && test -s shoes.json && test -s card-links.js
